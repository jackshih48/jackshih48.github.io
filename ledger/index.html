<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>記一筆</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="theme-color" content="#f3f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="記一筆">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3f3f1; touch-action: pan-x pan-y; }
  @media (prefers-color-scheme: dark) { html, body { background: #121211; } }
  /* 讓 App 避開瀏海和底部橫條 */
  iframe {
    position: fixed; left: 0; right: 0;
    top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
    width: 100%; height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    border: 0;
  }
</style>
</head>
<body>
<!-- 把下面的網址換成你的 Apps Script 網頁應用程式網址（結尾是 /exec） -->
<iframe src="https://script.google.com/macros/s/AKfycbwqNl6aCpE3PtFiINAT5u3hsIQYPXdHBLFe3iCROUia_Jclly5IMKpeWkbUbU4YYkgx1g/exec" title="記一筆" allow="clipboard-write"></iframe>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  // App 裡換主題時，手機最上面的狀態列和底部也跟著換顏色
  function setBg(c) {
    document.documentElement.style.background = c;
    document.body.style.background = c;
    document.querySelectorAll('meta[name="theme-color"]').forEach((m) => m.setAttribute('content', c));
  }
  try { const saved = localStorage.getItem('ledger.bg'); if (saved) setBg(saved); } catch (e) {}
  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type !== 'ledger-theme' || !/^#[0-9a-fA-F]{3,8}$/.test(d.bg || '')) return; // 只接受顏色碼
    setBg(d.bg);
    try { localStorage.setItem('ledger.bg', d.bg); } catch (err) {}
    try { if (e.source) e.source.postMessage({ type: 'ledger-theme-ok' }, '*'); } catch (err) {} // 回一聲讓 App 知道成功了
  });
</script>
</body>
</html>
